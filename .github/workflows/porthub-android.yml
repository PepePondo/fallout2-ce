name: PortHub Android build

on:
  push:
    branches:
      - porthub
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  android:
    name: Android

    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      - name: Build
        run: |
          cd os/android
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-porthub-debug.apk
          path: os/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
